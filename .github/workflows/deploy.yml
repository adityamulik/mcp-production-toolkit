name: Deploy & Validate Pods

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: Start services
        run: |
          docker compose up -d
          echo "Services starting..."
          sleep 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to reach healthy state..."
          for i in {1..60}; do
            echo "Attempt $i/60..."
            
            # Check gateway
            if docker compose ps gateway | grep -q "healthy"; then
              echo "✓ Gateway is healthy"
            else
              echo "✗ Gateway not yet healthy"
            fi
            
            # Check dashboard
            if docker compose ps dashboard | grep -q "healthy"; then
              echo "✓ Dashboard is healthy"
            else
              echo "✗ Dashboard not yet healthy"
            fi
            
            # Check team servers
            for team in team-a team-b team-c; do
              if docker compose ps $team | grep -q "healthy"; then
                echo "✓ $team is healthy"
              else
                echo "✗ $team not yet healthy"
              fi
            done
            
            # Count healthy services
            healthy_count=$(docker compose ps | grep -c "healthy")
            if [ "$healthy_count" -ge 5 ]; then
              echo "All services are healthy!"
              break
            fi
            
            sleep 3
          done

      - name: Verify service status
        run: |
          echo "=== Service Status ==="
          docker compose ps
          echo ""
          
          healthy_count=$(docker compose ps | grep -c "healthy")
          if [ "$healthy_count" -lt 5 ]; then
            echo "ERROR: Not all services are healthy"
            docker compose logs
            exit 1
          fi
          
          echo "✓ All services are healthy"

      - name: Test gateway health endpoint
        run: |
          echo "Testing gateway /health endpoint..."
          response=$(curl -s http://localhost:3000/health || echo "failed")
          echo "Response: $response"
          
          if [ "$response" != "failed" ]; then
            echo "✓ Gateway health check passed"
          else
            echo "✗ Gateway health check failed"
            exit 1
          fi

      - name: Test gateway metrics endpoint
        run: |
          echo "Testing gateway /metrics endpoint..."
          response=$(curl -s http://localhost:3000/metrics)
          
          if [ -n "$response" ]; then
            echo "✓ Gateway metrics endpoint responding"
          else
            echo "✗ Gateway metrics endpoint failed"
            exit 1
          fi

      - name: Test gateway stats endpoint
        run: |
          echo "Testing gateway /stats endpoint..."
          response=$(curl -s http://localhost:3000/stats)
          
          if echo "$response" | grep -q "allowed\|blocked"; then
            echo "✓ Gateway stats endpoint responding with data"
            echo "Stats: $response"
          else
            echo "✗ Gateway stats endpoint failed"
            echo "Response: $response"
            exit 1
          fi

      - name: Test dashboard endpoint
        run: |
          echo "Testing dashboard endpoint..."
          response=$(curl -s -I http://localhost:5173/)
          
          if echo "$response" | grep -q "200\|301\|302"; then
            echo "✓ Dashboard is responding"
          else
            echo "✗ Dashboard failed"
            echo "Response: $response"
            exit 1
          fi

      - name: Test team server endpoints
        run: |
          echo "Testing Team A server..."
          curl -s http://localhost:8001/health && echo "✓ Team A health passed" || echo "✗ Team A health failed"
          
          echo "Testing Team B server..."
          curl -s http://localhost:8002/health && echo "✓ Team B health passed" || echo "✗ Team B health failed"
          
          echo "Testing Team C server..."
          curl -s http://localhost:8003/health && echo "✓ Team C health passed" || echo "✗ Team C health failed"

      - name: Verify metrics persistence
        run: |
          echo "Testing metrics database..."
          response=$(curl -s http://localhost:3000/stats/db/info)
          
          if echo "$response" | grep -q "database\|status"; then
            echo "✓ Metrics database is initialized"
            echo "Response: $response"
          else
            echo "✗ Metrics database check failed"
            echo "Response: $response"
            exit 1
          fi

      - name: Run integration test
        run: |
          echo "Running integration test..."
          
          # Get auth token
          echo "Requesting authentication token..."
          token=$(curl -s -X POST http://localhost:3000/auth/token \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$token" ]; then
            echo "✗ Failed to get auth token"
            exit 1
          fi
          
          echo "✓ Successfully obtained auth token"
          
          # Test stats with token
          echo "Testing /stats with token..."
          stats=$(curl -s -H "Authorization: Bearer $token" http://localhost:3000/stats)
          
          if echo "$stats" | grep -q "allowed\|blocked\|total"; then
            echo "✓ Authenticated stats request successful"
            echo "Stats: $stats"
          else
            echo "✗ Authenticated stats request failed"
            exit 1
          fi

      - name: Collect service logs on failure
        if: failure()
        run: |
          echo "=== Gateway Logs ==="
          docker compose logs gateway || true
          echo ""
          echo "=== Dashboard Logs ==="
          docker compose logs dashboard || true
          echo ""
          echo "=== Team A Logs ==="
          docker compose logs team-a || true
          echo ""
          echo "=== Team B Logs ==="
          docker compose logs team-b || true
          echo ""
          echo "=== Team C Logs ==="
          docker compose logs team-c || true

      - name: Clean up
        if: always()
        run: |
          echo "Stopping and removing containers..."
          docker compose down || true

      - name: Success summary
        if: success()
        run: |
          echo "✅ All tests passed!"
          echo ""
          echo "Summary:"
          echo "  ✓ Docker images built successfully"
          echo "  ✓ All pods started and healthy"
          echo "  ✓ Gateway endpoints responding"
          echo "  ✓ Dashboard endpoint responding"
          echo "  ✓ Team servers responding"
          echo "  ✓ Metrics database initialized"
          echo "  ✓ Authentication working"
          echo "  ✓ Integration tests passing"
